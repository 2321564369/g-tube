<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Player</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player {
            width: 850px;
            max-width: 95%;
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
        }

        .input {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            font-weight: bold;
            cursor: pointer;
        }

        #video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
        }

        #search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .result-card {
            min-width: 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            color: white;
            text-align: left;
            padding: 0;
        }

        .result-card:hover { border-color: #38bdf8; }
        .result-card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .result-card span { display: block; padding: 9px; font-size: 13px; line-height: 1.35; }
        #search-status { color: #94a3b8; font-size: 13px; margin-top: 8px; }
        .search-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .search-actions button { flex: 1; min-width: 145px; }
        .search-actions .secondary { background: #334155; color: white; }
        .result-card { display: block; width: 100%; }
        .result-card.active { border-color: #38bdf8; }

        #description-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: none;
        }

        #description-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 16px;
        }

        #description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="player">

    

    <h1>Search YouTube</h1>
    <div class="input">
        <input id="search-query" placeholder="Search videos..." onkeydown="if(event.key==='Enter') searchYouTube()">
        <button onclick="searchYouTube('videos')">Search</button>
    </div>
    <div class="search-actions">
        <button onclick="searchYouTube('videos')">Search Videos</button>
        <button class="secondary" onclick="searchYouTube('mixes')">🎵 Find Music Mixes</button>
    </div>
    <div id="search-status">Search YouTube, or find music mixes that keep playing related songs.</div>
    <div id="search-results"></div>

    <h2 style="margin:18px 0 10px">Or play a URL</h2>
    <div class="input">
        <input id="url" placeholder="Paste a YouTube URL">
        <button onclick="loadYouTube()">Load</button>
    </div>

    <div id="video"></div>

    <div id="status">
        Enter a YouTube URL.
    </div>

    <div id="description-box">
        <h3>Video Details</h3>
        <p id="description"></p>
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;
let radioMode = false;
let radioQueue = [];
let radioIndex = -1;
let radioSeedTitle = "";
let radioLoading = false;
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
}

// Personal prototype setup: the key is visible in this client-side file.
const YOUTUBE_API_KEY = "AIzaSyCQ9s-fk3EqgDFAWY3GfNLwovs_l5Vm5hQ";

async function searchYouTube(mode = "videos") {
    const rawQuery = document.getElementById("search-query").value.trim();
    const query = rawQuery;
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");

    if (!query) {
        status.textContent = "Enter something to search for.";
        return;
    }

    status.textContent = "Searching YouTube...";
    results.innerHTML = "";

    try {
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({
            part: "snippet",
            type: "video",
            safeSearch: "moderate",
            maxResults: mode === "mixes" ? "25" : "18",
            q: mode === "mixes" ? (query + " songs").trim() : query,
            key: YOUTUBE_API_KEY
        }).toString();

        const response = await fetch(url.toString());
        const payload = await response.json();

        if (!response.ok || payload.error) {
            const message = payload.error?.message || "YouTube search failed.";
            throw new Error(message);
        }

        const items = (payload.items || []).filter(item => item.id && item.id.videoId);
        if (!items.length) {
            status.textContent = mode === "mixes" ? "No mixes found. Try a different artist or genre." : "No results found.";
            return;
        }

        results.innerHTML = items.map(item => {
            const snippet = item.snippet || {};
            const thumbs = snippet.thumbnails || {};
            const thumb = (thumbs.high || thumbs.medium || thumbs.default || {}).url || "";
            return '<button class="result-card" data-video-id="' + escapeHTML(item.id.videoId) +
                '" data-video-title="' + escapeHTML(snippet.title || "YouTube video") + '">' +
                '<img src="' + escapeHTML(thumb) + '" alt="">' +
                '<span>' + escapeHTML(snippet.title || "Untitled") + '<br><small>' +
                escapeHTML(snippet.channelTitle || "") + '</small></span></button>';
        }).join("");

        results.querySelectorAll(".result-card").forEach(card => {
            card.addEventListener("click", () => {
                if (!player) {
                    status.textContent = "YouTube player is still loading. Try again in a moment.";
                    return;
                }
                const videoId = card.dataset.videoId;
                document.getElementById("url").value =
                    "https://www.youtube.com/watch?v=" + videoId;
                fetchVideoDetails(videoId);

                if (mode === "mixes") {
                    startMusicMix(videoId, card.dataset.videoTitle);
                } else {
                    radioMode = false;
                    radioQueue = [];
                    radioIndex = -1;
                    player.loadVideoById(videoId);
                    document.getElementById("status").textContent =
                        "▶️ Playing: " + card.dataset.videoTitle;
                }
            });
        });

        status.textContent = mode === "mixes"
            ? "Found " + items.length + " songs. Select one to start a radio mix that queues similar tracks."
            : "Found " + items.length + " videos. Select one to play.";
    } catch (error) {
        console.error("[G-Tube search]", error);
        status.textContent = "Search failed: " + (error.message || String(error));
    }
}


// Start a song-based radio queue, using YouTube search results for similar tracks.
async function startMusicMix(videoId, title = "your selected song") {
    if (!player) { document.getElementById("status").textContent = "YouTube player is still loading. Try again in a moment."; return; }
    radioMode = true; radioSeedTitle = title; radioQueue = [{ id: videoId, title: title }]; radioIndex = 0;
    player.loadVideoById(videoId);
    document.getElementById("status").textContent = "🎵 Radio mix started: " + title + " — finding similar songs…";
    await addRadioTracks(videoId, title);
}

async function addRadioTracks(seedId, seedTitle) {
    if (radioLoading || !radioMode) return;
    radioLoading = true;
    try {
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({ part: "snippet", type: "video", videoCategoryId: "10", safeSearch: "moderate", maxResults: "25", q: seedTitle + " similar songs music", key: YOUTUBE_API_KEY }).toString();
        const response = await fetch(url.toString());
        const payload = await response.json();
        if (!response.ok || payload.error) throw new Error(payload.error?.message || "Could not find radio tracks.");
        const known = new Set(radioQueue.map(track => track.id));
        for (const item of payload.items || []) {
            const id = item.id && item.id.videoId;
            if (!id || id === seedId || known.has(id)) continue;
            radioQueue.push({ id: id, title: (item.snippet || {}).title || "YouTube song" }); known.add(id);
        }
        document.getElementById("status").textContent = radioQueue.length > 1 ? "🎵 Radio mix playing: " + radioSeedTitle + " · " + (radioQueue.length - 1) + " songs queued" : "🎵 Playing " + radioSeedTitle + ". No similar tracks were found; try another song.";
    } catch (error) { console.error("[G-Tube radio mix]", error); document.getElementById("status").textContent = "🎵 Playing " + radioSeedTitle + ". Could not build queue: " + error.message;
    } finally { radioLoading = false; }
}

function playNextRadioTrack() {
    if (!radioMode) return;
    radioIndex++;
    if (radioIndex < radioQueue.length) {
        const track = radioQueue[radioIndex]; player.loadVideoById(track.id);
        document.getElementById("url").value = "https://www.youtube.com/watch?v=" + track.id;
        fetchVideoDetails(track.id);
        document.getElementById("status").textContent = "🎵 Radio mix: " + track.title + " · " + (radioQueue.length - radioIndex - 1) + " queued";
        if (radioQueue.length - radioIndex <= 5) addRadioTracks(radioQueue[0].id, radioSeedTitle);
    } else {
        document.getElementById("status").textContent = "🎵 Radio mix queue ended. Searching for more songs…";
        addRadioTracks(radioQueue[0].id, radioSeedTitle).then(() => { if (radioMode && radioIndex >= radioQueue.length - 1) playNextRadioTrack(); });
    }
}

// YouTube calls this automatically
function onYouTubeIframeAPIReady() {

    player = new YT.Player("video", {

        width: "100%",
        height: "100%",

        videoId: "",

        playerVars: {
            playsinline: 1,
            rel: 0
        },

        events: {
            onStateChange: function (event) { if (event.data === YT.PlayerState.ENDED && radioMode) playNextRadioTrack(); },
            onReady: function () {

                document.getElementById("status").textContent =
                    "Ready — paste a YouTube URL.";

            },

            onError: function (event) {

                document.getElementById("status").textContent =
                    "❌ YouTube couldn't play this video.";

            }
        }
    });
}


// Get ID from YouTube URL
function getVideoID(url) {

    try {

        const u = new URL(url);

        // youtube.com/watch?v=XXXX
        if (u.hostname.includes("youtube.com")) {

            return u.searchParams.get("v");
        }

        // youtu.be/XXXX
        if (u.hostname === "youtu.be") {

            return u.pathname.substring(1);
        }

        return null;

    } catch {

        return null;
    }
}


// Fetch video title and snippet metadata via oEmbed
async function fetchVideoDetails(id) {
    const descBox = document.getElementById("description-box");
    const descText = document.getElementById("description");

    try {
        const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        
        if (!response.ok) throw new Error("Metadata request failed");

        const data = await response.json();
        
        descText.textContent = `Title: ${data.title}\nAuthor: ${data.author_name}`;
        descBox.style.display = "block";
    } catch {
        // Fallback if oEmbed is blocked or fails
        descText.textContent = "Unable to retrieve description details for this video.";
        descBox.style.display = "block";
    }
}


// Load video
function loadYouTube() {

    const url =
        document.getElementById("url").value.trim();

    const id = getVideoID(url);

    if (!id) {

        document.getElementById("status").textContent =
            "❌ Invalid YouTube URL.";

        return;
    }

    if (!player) {

        document.getElementById("status").textContent =
            "YouTube is still loading. Try again in a second.";

        return;
    }

    radioMode = false; radioQueue = []; radioIndex = -1;
    player.loadVideoById(id);
    fetchVideoDetails(id);

    document.getElementById("status").textContent =
        "▶️ Playing YouTube video";

}

</script>

</body>
</html>
