<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Player</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player {
            width: 850px;
            max-width: 95%;
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
        }

        .input {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            font-weight: bold;
            cursor: pointer;
        }

        #video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
        }

        #search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .result-card {
            min-width: 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            color: white;
            text-align: left;
            padding: 0;
        }

        .result-card:hover { border-color: #38bdf8; }
        .result-card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .result-card span { display: block; padding: 9px; font-size: 13px; line-height: 1.35; }
        #search-status { color: #94a3b8; font-size: 13px; margin-top: 8px; }
        .search-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .search-actions button { flex: 1; min-width: 145px; }
        .search-actions .secondary { background: #334155; color: white; }
        .result-card { display: block; width: 100%; }
        .result-card.active { border-color: #38bdf8; }

        #description-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: none;
        }

        #description-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 16px;
        }

        #description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="player">

    

    <h1>Search YouTube</h1>
    <div class="input">
        <input id="search-query" placeholder="Search videos..." onkeydown="if(event.key==='Enter') searchYouTube()">
        <button onclick="searchYouTube('videos')">Search</button>
    </div>
    <div class="search-actions">
        <button onclick="searchYouTube('videos')">Search Videos</button>
        <button class="secondary" onclick="searchYouTube('mixes')">🎵 Find Music Mixes</button>
    </div>
    <div id="search-status">Search YouTube, or find music mixes that keep playing related songs.</div>
    <div id="search-results"></div>

    <h2 style="margin:18px 0 10px">Or play a URL</h2>
    <div class="input">
        <input id="url" placeholder="Paste a YouTube URL">
        <button onclick="loadYouTube()">Load</button>
    </div>

    <div id="video"></div>

    <div id="status">
        Enter a YouTube URL.
    </div>

    <div id="description-box">
        <h3>Video Details</h3>
        <p id="description"></p>
    </div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;
let radioMode = false;
let radioQueue = [];
let radioIndex = -1;
let radioSeedTitle = "";
let radioSeedArtist = "";
let radioLoading = false;
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
}

// Personal prototype setup: the key is visible in this client-side file.
const YOUTUBE_API_KEY = "AIzaSyCQ9s-fk3EqgDFAWY3GfNLwovs_l5Vm5hQ";

async function searchYouTube(mode = "videos") {
    const rawQuery = document.getElementById("search-query").value.trim();
    const query = rawQuery;
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");

    if (!query) {
        status.textContent = "Enter something to search for.";
        return;
    }

    status.textContent = "Searching YouTube...";
    results.innerHTML = "";

    try {
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({
            part: "snippet",
            type: "video",
            safeSearch: "moderate",
            maxResults: mode === "mixes" ? "25" : "18",
            q: mode === "mixes" ? (query + " songs").trim() : query,
            key: YOUTUBE_API_KEY
        }).toString();

        const response = await fetch(url.toString());
        const payload = await response.json();

        if (!response.ok || payload.error) {
            const message = payload.error?.message || "YouTube search failed.";
            throw new Error(message);
        }

        const items = (payload.items || []).filter(item => item.id && item.id.videoId);
        if (!items.length) {
            status.textContent = mode === "mixes" ? "No mixes found. Try a different artist or genre." : "No results found.";
            return;
        }

        results.innerHTML = items.map(item => {
            const snippet = item.snippet || {};
            const thumbs = snippet.thumbnails || {};
            const thumb = (thumbs.high || thumbs.medium || thumbs.default || {}).url || "";
            return '<button class="result-card" data-video-id="' + escapeHTML(item.id.videoId) +
                '" data-video-title="' + escapeHTML(snippet.title || "YouTube video") + '" data-channel-title="' + escapeHTML(snippet.channelTitle || "") + '">' +
                '<img src="' + escapeHTML(thumb) + '" alt="">' +
                '<span>' + escapeHTML(snippet.title || "Untitled") + '<br><small>' +
                escapeHTML(snippet.channelTitle || "") + '</small></span></button>';
        }).join("");

        results.querySelectorAll(".result-card").forEach(card => {
            card.addEventListener("click", () => {
                if (!player) {
                    status.textContent = "YouTube player is still loading. Try again in a moment.";
                    return;
                }
                const videoId = card.dataset.videoId;
                document.getElementById("url").value =
                    "https://www.youtube.com/watch?v=" + videoId;
                fetchVideoDetails(videoId);

                if (mode === "mixes") {
                    startMusicMix(videoId, card.dataset.videoTitle, card.dataset.channelTitle);
                } else {
                    radioMode = false;
                    radioQueue = [];
                    radioIndex = -1;
                    player.loadVideoById(videoId);
                    document.getElementById("status").textContent =
                        "▶️ Playing: " + card.dataset.videoTitle;
                }
            });
        });

        status.textContent = mode === "mixes"
            ? "Found " + items.length + " songs. Select one to start a radio mix that queues similar tracks."
            : "Found " + items.length + " videos. Select one to play.";
    } catch (error) {
        console.error("[G-Tube search]", error);
        status.textContent = "Search failed: " + (error.message || String(error));
    }
}


// Build a broader radio queue around the artist/seed rather than searching only the exact song title.
// The YouTube Data API does not expose YouTube Music Radio recommendations directly.
async function startMusicMix(videoId, title = "your selected song", channel = "") {
    if (!player) { document.getElementById("status").textContent = "YouTube player is still loading. Try again in a moment."; return; }
    radioMode = true;
    radioSeedTitle = title;
    radioSeedArtist = guessArtist(title, channel);
    radioQueue = [{ id: videoId, title: title }];
    radioIndex = 0;
    player.loadVideoById(videoId);
    document.getElementById("status").textContent = "🎵 Starting radio for " + radioSeedArtist + " — finding a wider mix…";
    await addRadioTracks(videoId);
}

function guessArtist(title, channel) {
    const cleaned = String(title || "").replace(/\s*\((official|lyrics?|audio|music video|video).*?\)/ig, "").trim();
    const separators = [" - ", " – ", " — ", " | "];
    for (const sep of separators) {
        if (cleaned.includes(sep)) {
            const first = cleaned.split(sep)[0].trim();
            if (first.length > 1 && first.length < 60) return first;
        }
    }
    return channel && !/topic|vevo|records|official/i.test(channel) ? channel : cleaned;
}

async function addRadioTracks(seedId) {
    if (radioLoading || !radioMode) return;
    radioLoading = true;
    try {
        // Artist-led queries add variety: related artists, genre, and radio-style searches.
        const q = radioSeedTitle + " similar songs music";
        const searchUrl = new URL("https://www.googleapis.com/youtube/v3/search");
        searchUrl.search = new URLSearchParams({ part: "snippet", type: "video", videoCategoryId: "10", safeSearch: "moderate", maxResults: "50", order: "relevance", q: q, key: YOUTUBE_API_KEY }).toString();
        const response = await fetch(searchUrl.toString());
        const payload = await response.json();
        if (!response.ok || payload.error) throw new Error(payload.error?.message || "Could not find radio tracks.");
        const candidates = (payload.items || []).filter(item => item.id && item.id.videoId).map(item => ({
            id: item.id.videoId,
            title: (item.snippet || {}).title || "YouTube song",
            channel: (item.snippet || {}).channelTitle || ""
        }));
        const ids = candidates.map(item => item.id).filter((id, index, arr) => id !== seedId && arr.indexOf(id) === index);
        const known = new Set(radioQueue.map(track => track.id));
        const seedTitleKey = normalizeSongTitle(radioSeedTitle);
        // Duration metadata helps reject short clips and most Shorts; YouTube does not expose a definitive Shorts flag here.
        let durations = {};
        for (let i = 0; i < ids.length; i += 50) {
            const batch = ids.slice(i, i + 50);
            if (!batch.length) continue;
            const detailsUrl = new URL("https://www.googleapis.com/youtube/v3/videos");
            detailsUrl.search = new URLSearchParams({ part: "contentDetails", id: batch.join(","), key: YOUTUBE_API_KEY }).toString();
            const detailsResponse = await fetch(detailsUrl.toString());
            const details = await detailsResponse.json();
            if (detailsResponse.ok) for (const item of details.items || []) durations[item.id] = parseIsoDuration(item.contentDetails && item.contentDetails.duration);
        }
        const clean = candidates.filter(track => {
            if (known.has(track.id) || track.id === seedId) return false;
            if (normalizeSongTitle(track.title) === seedTitleKey) return false;
            if (/#shorts?\b|\bshorts\b|\bteaser\b|\bsnippet\b|\bpreview\b|\bsped up\b|\bslowed\b|\bnightcore\b/i.test(track.title)) return false;
            const seconds = durations[track.id];
            return seconds !== undefined && seconds >= 150;
        });
        // Mix up the order so the radio is not simply the first batch of search results.
        for (let i = clean.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [clean[i], clean[j]] = [clean[j], clean[i]]; }
        for (const track of clean) { if (!known.has(track.id)) { radioQueue.push(track); known.add(track.id); } }
        document.getElementById("status").textContent = radioQueue.length > 1
            ? "🎵 Radio for " + radioSeedArtist + " · " + (radioQueue.length - 1) + " tracks queued"
            : "🎵 Playing " + radioSeedArtist + ". YouTube did not return enough suitable tracks; try another starting song.";
    } catch (error) {
        console.error("[G-Tube radio mix]", error);
        document.getElementById("status").textContent = "🎵 Playing " + radioSeedArtist + ". Could not build radio queue: " + error.message;
    } finally { radioLoading = false; }
}

function normalizeSongTitle(title) {
    return String(title || "")
        .toLowerCase()
        .replace(/\([^)]*(official|lyrics?|audio|music video|visualizer|4k|hd)[^)]*\)/g, " ")
        .replace(/\b(official|lyrics?|audio|music video|visualizer|4k|hd|remaster(ed)?|\d{4} remaster)\b/g, " ")
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
}

function parseIsoDuration(value) {
    if (!value) return undefined;
    const match = value.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!match) return undefined;
    return Number(match[1] || 0) * 3600 + Number(match[2] || 0) * 60 + Number(match[3] || 0);
}

function playNextRadioTrack() {
    if (!radioMode) return;
    radioIndex++;
    if (radioIndex < radioQueue.length) {
        const track = radioQueue[radioIndex];
        player.loadVideoById(track.id);
        document.getElementById("url").value = "https://www.youtube.com/watch?v=" + track.id;
        fetchVideoDetails(track.id);
        document.getElementById("status").textContent = "🎵 Radio for " + radioSeedArtist + " · playing " + track.title + " · " + (radioQueue.length - radioIndex - 1) + " queued";
        if (radioQueue.length - radioIndex <= 8) addRadioTracks(radioQueue[0].id);
    } else {
        document.getElementById("status").textContent = "🎵 Finding more radio tracks…";
        addRadioTracks(radioQueue[0].id).then(() => { if (radioMode && radioIndex >= radioQueue.length - 1) { if (radioIndex + 1 < radioQueue.length) playNextRadioTrack(); } });
    }
}

// YouTube calls this automatically
function onYouTubeIframeAPIReady() {

    player = new YT.Player("video", {

        width: "100%",
        height: "100%",

        videoId: "",

        playerVars: {
            playsinline: 1,
            rel: 0
        },

        events: {
            onStateChange: function (event) { if (event.data === YT.PlayerState.ENDED && radioMode) playNextRadioTrack(); },
            onReady: function () {

                document.getElementById("status").textContent =
                    "Ready — paste a YouTube URL.";

            },

            onError: function (event) {

                document.getElementById("status").textContent =
                    "❌ YouTube couldn't play this video.";

            }
        }
    });
}


// Get ID from YouTube URL
function getVideoID(url) {

    try {

        const u = new URL(url);

        // youtube.com/watch?v=XXXX
        if (u.hostname.includes("youtube.com")) {

            return u.searchParams.get("v");
        }

        // youtu.be/XXXX
        if (u.hostname === "youtu.be") {

            return u.pathname.substring(1);
        }

        return null;

    } catch {

        return null;
    }
}


// Fetch video title and snippet metadata via oEmbed
async function fetchVideoDetails(id) {
    const descBox = document.getElementById("description-box");
    const descText = document.getElementById("description");

    try {
        const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        
        if (!response.ok) throw new Error("Metadata request failed");

        const data = await response.json();
        
        descText.textContent = `Title: ${data.title}\nAuthor: ${data.author_name}`;
        descBox.style.display = "block";
    } catch {
        // Fallback if oEmbed is blocked or fails
        descText.textContent = "Unable to retrieve description details for this video.";
        descBox.style.display = "block";
    }
}


// Load video
function loadYouTube() {

    const url =
        document.getElementById("url").value.trim();

    const id = getVideoID(url);

    if (!id) {

        document.getElementById("status").textContent =
            "❌ Invalid YouTube URL.";

        return;
    }

    if (!player) {

        document.getElementById("status").textContent =
            "YouTube is still loading. Try again in a second.";

        return;
    }

    radioMode = false; radioQueue = []; radioIndex = -1;
    player.loadVideoById(id);
    fetchVideoDetails(id);

    document.getElementById("status").textContent =
        "▶️ Playing YouTube video";

}

</script>

</body>
</html>
