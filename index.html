<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy-tube</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: #000;
  color: #fff;
  min-height: 100vh;
}

/* Galaxy background */
.galaxy {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(95, 61, 196, 0.8), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(14, 165, 233, 0.6), transparent 35%),
    radial-gradient(circle at 50% 50%, #020617, #000);
  z-index: -2;
}
.galaxy::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 50px 80px, #fff, transparent),
    radial-gradient(1px 1px at 200px 150px, #fff, transparent),
    radial-gradient(1px 1px at 400px 300px, #fff, transparent),
    radial-gradient(1px 1px at 600px 100px, #fff, transparent),
    radial-gradient(1px 1px at 800px 400px, #fff, transparent),
    radial-gradient(1px 1px at 100px 500px, #fff, transparent);
  animation: stars 60s linear infinite;
  opacity: 0.5;
}
@keyframes stars {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 20px;
  margin: 15px 20px 0;
  position: sticky;
  top: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px) saturate(1.2);
  border-radius: 16px;
  border: 1px solid rgba(167, 139, 250, 0.08);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  z-index: 10;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: #a78bfa;
  text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
  white-space: nowrap;
}

.search-container {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  max-width: 500px;
}
#searchInput {
  flex: 1;
  padding: 8px 15px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(167, 139, 250, 0.3);
  border-radius: 20px;
  color: white;
  font-size: 14px;
}
#searchInput:focus {
  outline: none;
  border-color: #a78bfa;
  box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
  background: rgba(255, 255, 255, 0.15);
}
#searchInput::placeholder { color: rgba(255, 255, 255, 0.5); }

.current-user {
  margin-left: auto;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  border: 1px solid rgba(167, 139, 250, 0.2);
  white-space: nowrap;
}
.current-user:hover { color: #fff; background: rgba(167, 139, 250, 0.1); }

/* App layout */
.app {
  display: flex;
  padding: 20px;
  gap: 20px;
}

/* Sidebar */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: rgba(15, 23, 42, 0.85);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  height: fit-content;
}
.sidebar ul { list-style: none; }
.sidebar li {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 15px;
  margin: 4px 0;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s ease;
  color: rgba(255, 255, 255, 0.8);
  font-size: 14px;
}
.sidebar li:hover { background: rgba(167, 139, 250, 0.1); color: #fff; }
.sidebar li.active {
  background: rgba(167, 139, 250, 0.2);
  color: #a78bfa;
  font-weight: 600;
}
.sidebar .nav-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sidebar .nav-icon svg {
  width: 20px; height: 20px;
  filter: drop-shadow(0 0 3px rgba(167, 139, 250, 0.4));
}

/* Content */
.content { flex: 1; min-width: 0; }

.section-title {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
  margin: 10px 0 16px;
}

/* Video grid */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.video-card { cursor: pointer; }
.thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #2a1b69;
  border: 2px solid rgba(167, 139, 250, 0.2);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.2s ease;
}
.video-card:hover .thumb-wrap {
  border-color: rgba(167, 139, 250, 0.6);
  box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
  transform: translateY(-2px);
}
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.duration-badge {
  position: absolute;
  bottom: 6px; right: 6px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
}
.video-meta { display: flex; gap: 10px; margin-top: 10px; }
.video-meta .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
}
.video-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: #fff;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.video-channel { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }

/* Shorts row */
.shorts-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.short-card { flex: 0 0 auto; width: 170px; cursor: pointer; }
.short-thumb {
  width: 170px; height: 300px;
  border-radius: 12px;
  background: #2a1b69;
  border: 2px solid rgba(167, 139, 250, 0.2);
  overflow: hidden;
  transition: all 0.2s ease;
}
.short-card:hover .short-thumb {
  border-color: rgba(167, 139, 250, 0.6);
  box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
  transform: translateY(-2px);
}
.short-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.short-title {
  font-size: 13px;
  color: #fff;
  margin-top: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: rgba(255, 255, 255, 0.6);
}

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; }
  .sidebar ul { display: flex; overflow-x: auto; gap: 8px; }
  .sidebar li { white-space: nowrap; }
}
</style>
</head>
<body>

<div class="galaxy"></div>

<div class="topbar">
  <div class="logo">🌌 Galaxy-tube</div>
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search videos...">
  </div>
  <div class="current-user" id="accountPill" onclick="promptUsername()">Sign in</div>
</div>

<div class="app">
  <nav class="sidebar">
    <ul>
      <li class="active">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#a78bfa"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg></span>
        Home
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="2" width="14" height="20" rx="3"/><polygon points="10,9 16,12 10,15" fill="#7c3aed"/></svg></span>
        Shorts
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></span>
        For You
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        History
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 2h12v20l-6-4-6 4z"/></svg></span>
        Watch Later
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg></span>
        Playlists
      </li>
    </ul>
  </nav>

  <div class="content">
    <div class="section-title">Videos</div>
    <div class="video-grid" id="videoGrid">
      <div class="empty">Loading...</div>
    </div>

    <div class="section-title">Shorts</div>
    <div class="shorts-row" id="shortsRow">
      <div class="empty">Loading...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://lpqrbrglatpcywdugkid.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwcXJicmdsYXRwY3l3ZHVna2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTcwMTAsImV4cCI6MjEwMTM3MzAxMH0.H4tvl85-IDvsJnICtnTy7dI1k-u8Xn9diVDPnLEG9a8";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function formatDuration(seconds) {
    if (!seconds) return "";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }
  function initial(str) { return (str || "?").trim().charAt(0).toUpperCase(); }

  async function loadHome() {
    const { data: videos, error: vErr } = await sb
      .from("videos").select("*")
      .eq("is_short", false).eq("status", "ready")
      .order("created_at", { ascending: false }).limit(8);

    const { data: shorts, error: sErr } = await sb
      .from("videos").select("*")
      .eq("is_short", true).eq("status", "ready")
      .order("created_at", { ascending: false }).limit(10);

    const grid = document.getElementById("videoGrid");
    const row = document.getElementById("shortsRow");

    if (vErr) grid.innerHTML = `<div class="empty">Error: ${vErr.message}</div>`;
    else if (!videos.length) grid.innerHTML = `<div class="empty">No videos yet — search to add some.</div>`;
    else grid.innerHTML = videos.map(v => `
      <div class="video-card" onclick="location.href='watch.html?id=${v.id}'">
        <div class="thumb-wrap">
          <img src="${v.thumbnail_url || ''}" alt="${v.title}">
          <div class="duration-badge">${formatDuration(v.duration_seconds)}</div>
        </div>
        <div class="video-meta">
          <div class="avatar">${initial(v.channel)}</div>
          <div>
            <div class="video-title">${v.title}</div>
            <div class="video-channel">${v.channel || "Unknown channel"}</div>
          </div>
        </div>
      </div>
    `).join("");

    if (sErr) row.innerHTML = `<div class="empty">Error: ${sErr.message}</div>`;
    else if (!shorts.length) row.innerHTML = `<div class="empty">No Shorts yet.</div>`;
    else row.innerHTML = shorts.map(v => `
      <div class="short-card" onclick="location.href='watch.html?id=${v.id}'">
        <div class="short-thumb"><img src="${v.thumbnail_url || ''}" alt="${v.title}"></div>
        <div class="short-title">${v.title}</div>
      </div>
    `).join("");
  }

  function promptUsername() {
    const existing = localStorage.getItem("galaxy_video_username");
    const name = prompt("Enter a username:", existing || "");
    if (name && name.trim()) {
      localStorage.setItem("galaxy_video_username", name.trim());
      updateAccountPill();
    }
  }
  function updateAccountPill() {
    document.getElementById("accountPill").textContent = localStorage.getItem("galaxy_video_username") || "Sign in";
  }

  updateAccountPill();
  loadHome();
</script>

</body>
</html>
