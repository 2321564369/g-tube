<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy-tube</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #000; color: #fff; min-height: 100vh; }

.galaxy {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(95, 61, 196, 0.8), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(14, 165, 233, 0.6), transparent 35%),
    radial-gradient(circle at 50% 50%, #020617, #000);
  z-index: -2;
}
.galaxy::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 50px 80px, #fff, transparent),
    radial-gradient(1px 1px at 200px 150px, #fff, transparent),
    radial-gradient(1px 1px at 400px 300px, #fff, transparent),
    radial-gradient(1px 1px at 600px 100px, #fff, transparent),
    radial-gradient(1px 1px at 800px 400px, #fff, transparent),
    radial-gradient(1px 1px at 100px 500px, #fff, transparent);
  animation: stars 60s linear infinite;
  opacity: 0.5;
}
@keyframes stars { from { transform: translateY(0); } to { transform: translateY(-1000px); } }

.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 15px 20px; margin: 15px 20px 0;
  position: sticky; top: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px) saturate(1.2);
  border-radius: 16px;
  border: 1px solid rgba(167, 139, 250, 0.08);
  box-shadow: 0 4px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  z-index: 10;
}
.logo { font-size: 20px; font-weight: 700; color: #a78bfa; text-shadow: 0 0 10px rgba(167,139,250,0.5); white-space: nowrap; }
.search-container { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 500px; }
#searchInput {
  flex: 1; padding: 8px 15px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(167,139,250,0.3); border-radius: 20px; color: white; font-size: 14px;
}
#searchInput:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 20px rgba(167,139,250,0.2); background: rgba(255,255,255,0.15); }
#searchInput::placeholder { color: rgba(255,255,255,0.5); }
#searchBtn {
  padding: 8px 16px; background: linear-gradient(135deg, #7c3aed, #5b21b6);
  border: none; border-radius: 20px; color: white; cursor: pointer; font-weight: 600; font-size: 14px;
}
#searchBtn:hover { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.current-user {
  margin-left: auto; font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer;
  padding: 6px 14px; background: rgba(255,255,255,0.05); border-radius: 20px;
  border: 1px solid rgba(167,139,250,0.2); white-space: nowrap;
}
.current-user:hover { color: #fff; background: rgba(167,139,250,0.1); }

.app { display: flex; padding: 20px; gap: 20px; }
.sidebar {
  width: 220px; flex-shrink: 0; background: rgba(15,23,42,0.85);
  border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); height: fit-content;
}
.sidebar ul { list-style: none; }
.sidebar li {
  display: flex; align-items: center; gap: 14px; padding: 12px 15px; margin: 4px 0;
  cursor: pointer; border-radius: 8px; transition: all 0.2s ease; color: rgba(255,255,255,0.8); font-size: 14px;
}
.sidebar li:hover { background: rgba(167,139,250,0.1); color: #fff; }
.sidebar li.active { background: rgba(167,139,250,0.2); color: #a78bfa; font-weight: 600; }
.sidebar .nav-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.sidebar .nav-icon svg { width: 20px; height: 20px; filter: drop-shadow(0 0 3px rgba(167,139,250,0.4)); }

.content { flex: 1; min-width: 0; }
.section-title {
  font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(167,139,250,0.3);
  margin: 20px 0 16px; display: flex; align-items: center; justify-content: space-between;
}
.refresh-btn {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.05); border: 1px solid rgba(167,139,250,0.2);
  border-radius: 16px; padding: 6px 14px; cursor: pointer;
}
.refresh-btn:hover { color: #fff; background: rgba(167,139,250,0.15); }

.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.video-card { cursor: pointer; }
.thumb-wrap {
  position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
  background: #2a1b69; border: 2px solid rgba(167,139,250,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: all 0.2s ease;
}
.video-card:hover .thumb-wrap { border-color: rgba(167,139,250,0.6); box-shadow: 0 0 20px rgba(167,139,250,0.3); transform: translateY(-2px); }
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.duration-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.video-meta { display: flex; gap: 10px; margin-top: 10px; }
.video-meta .avatar {
  width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #5b21b6);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 20px rgba(124,58,237,0.3);
}
.video-title { font-size: 14px; font-weight: 600; line-height: 1.3; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.video-channel { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }

.shorts-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
.short-card { flex: 0 0 auto; width: 170px; cursor: pointer; }
.short-thumb {
  width: 170px; height: 300px; border-radius: 12px; background: #2a1b69;
  border: 2px solid rgba(167,139,250,0.2); overflow: hidden; transition: all 0.2s ease;
}
.short-card:hover .short-thumb { border-color: rgba(167,139,250,0.6); box-shadow: 0 0 20px rgba(167,139,250,0.3); transform: translateY(-2px); }
.short-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.short-title { font-size: 13px; color: #fff; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.empty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>

<div class="galaxy"></div>

<div class="topbar">
  <div class="logo">🌌 Galaxy-tube</div>
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search YouTube..." onkeydown="if(event.key==='Enter') search()">
    <button id="searchBtn" onclick="search()">🔍</button>
  </div>
  <div class="current-user" id="accountPill" title="Sign in to your G-Tube profile">Sign in</div>
  <div class="current-user" id="apiKeyPill" title="Create a G-Tube profile with username and PIN">Create profile</div>
</div>

<div class="app">
  <nav class="sidebar">
    <ul>
      <li class="active">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#a78bfa"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg></span>
        Home
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="2" width="14" height="20" rx="3"/><polygon points="10,9 16,12 10,15" fill="#7c3aed"/></svg></span>
        Shorts
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></span>
        For You
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        History
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 2h12v20l-6-4-6 4z"/></svg></span>
        Watch Later
      </li>
      <li>
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg></span>
        Playlists
      </li>
    </ul>
  </nav>

  <div class="content">
    <div class="section-title">
      <span id="videoSectionTitle">Suggested for you</span>
      <span class="refresh-btn" onclick="loadSuggestions()">↻ Refresh</span>
    </div>
    <div class="video-grid" id="videoGrid"><div class="empty">Loading suggestions...</div></div>

    <div class="section-title">Shorts</div>
    <div class="shorts-row" id="shortsRow"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
(async function installGalaxyPageEngine() {
  try {
    const engineUrl = "https://cdn.jsdelivr.net/gh/2321564369/g-tube@main/page-engine.html";
    const response = await fetch(engineUrl, { cache: "no-cache" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const html = await response.text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    const source = parsed.getElementById("galaxy-engine-source");
    if (!source) throw new Error("Engine source was not found.");
    const script = document.createElement("script");
    script.textContent = source.textContent;
    document.head.appendChild(script);
  } catch (error) {
    console.error("[Galaxy Page Engine] Failed to initialize:", error);
  }
})();
</script>

<script src="galaxy-client.js"></script>

<script>
(function () {
  "use strict";
  const auth = () => window.GalaxyYouTubeAuth;
  function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function durationText(s) { return s ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : ""; }
  async function fetchYouTube(q) {
    const api = auth();
    const s = await api.ytApi("search", { part: "snippet", type: "video", maxResults: 24, q, safeSearch: "moderate" });
    const ids = (s.items || []).map(x => x.id && x.id.videoId).filter(Boolean);
    if (!ids.length) return [];
    const d = await api.ytApi("videos", { part: "snippet,contentDetails", id: ids.join(",") });
    return (d.items || []).map(v => {
      const duration = v.contentDetails && v.contentDetails.duration || "";
      const m = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      const seconds = m ? +(m[1] || 0) * 3600 + +(m[2] || 0) * 60 + +(m[3] || 0) : 0;
      return { youtube_id: v.id, title: v.snippet && v.snippet.title || "Untitled", channel: v.snippet && v.snippet.channelTitle || "Unknown channel",
        thumbnail_url: v.snippet && v.snippet.thumbnails && ((v.snippet.thumbnails.high || v.snippet.thumbnails.medium || {}).url) || "",
        duration_seconds: seconds, is_short: seconds > 0 && seconds <= 60 };
    });
  }
  function gotoPage(file, params) {
    if (!window.GalaxyPageEngine) throw new Error("Page engine is still loading. Try again.");
    return window.GalaxyPageEngine.loadPage(file, params || {});
  }
  function renderVideoGrid(results) {
    const grid = document.getElementById("videoGrid"), videos = results.filter(v => !v.is_short);
    if (!videos.length) { grid.innerHTML = '<div class="empty">No videos found. Subscribe to channels or try searching YouTube.</div>'; return; }
    grid.innerHTML = videos.map(v => '<div class="video-card" data-yt="' + esc(v.youtube_id) + '" data-title="' + esc(v.title) + '">' +
      '<div class="thumb-wrap"><img src="' + esc(v.thumbnail_url) + '" alt=""><div class="duration-badge">' + durationText(v.duration_seconds) + '</div></div>' +
      '<div class="video-meta"><div class="avatar">' + esc((v.channel || "?").charAt(0).toUpperCase()) + '</div><div><div class="video-title">' + esc(v.title) + '</div><div class="video-channel">' + esc(v.channel) + '</div></div></div></div>').join("");
    grid.querySelectorAll(".video-card").forEach(el => el.addEventListener("click", () => openVideo(el.dataset.yt, el.dataset.title)));
  }
  function renderShortsRow(results) {
    const row = document.getElementById("shortsRow"), shorts = results.filter(v => v.is_short);
    if (!shorts.length) { row.innerHTML = '<div class="empty">No Shorts were found in these results.</div>'; return; }
    row.innerHTML = shorts.map(v => '<div class="short-card" data-yt="' + esc(v.youtube_id) + '" data-title="' + esc(v.title) + '"><div class="short-thumb"><img src="' + esc(v.thumbnail_url) + '" alt=""></div><div class="short-title">' + esc(v.title) + '</div></div>').join("");
    row.querySelectorAll(".short-card").forEach(el => el.addEventListener("click", () => openVideo(el.dataset.yt, el.dataset.title)));
  }
  function openVideo(id, title) { gotoPage("watch.html", { youtube_id: id, title }).catch(e => alert("Could not open video: " + e.message)); }
  function showError(e) {
    console.error("[YouTube API]", e);
    document.getElementById("videoGrid").innerHTML = '<div class="empty">Could not load videos: ' + esc(e.message || e) + '<br><br>Connect YouTube or set an API key. If Google reports origin_mismatch, add the actual Tryit parent-site origin to your OAuth client.</div>';
    document.getElementById("shortsRow").innerHTML = '<div class="empty">Shorts unavailable until the API request succeeds.</div>';
  }
  async function loadSuggestions() {
    const title = document.getElementById("videoSectionTitle");
    document.getElementById("videoGrid").innerHTML = '<div class="empty">Loading personalized suggestions...</div>';
    document.getElementById("shortsRow").innerHTML = '<div class="empty">Loading Shorts...</div>';
    try {
      let results = [];
      if (auth().signedIn()) {
        try { results = await auth().personalizedVideos(); }
        catch (e) { console.warn("[Galaxy-tube] Account recommendations failed; using public suggestions.", e); }
      }
      if (results.length) {
        title.textContent = "From your subscriptions";
      } else {
        if (!auth().apiKey() && !auth().signedIn()) throw new Error("Click Connect YouTube to personalize suggestions, or Set API key to browse public videos.");
        results = await fetchYouTube("trending music gaming");
        title.textContent = auth().signedIn() ? "Suggested videos" : "Trending suggestions";
      }
      renderVideoGrid(results); renderShortsRow(results);
    } catch (e) { showError(e); }
    auth().updateAccountButtons();
  }
  async function search() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) return loadSuggestions();
    document.getElementById("videoSectionTitle").textContent = 'Results for "' + q + '"';
    document.getElementById("videoGrid").innerHTML = '<div class="empty">Searching YouTube...</div>';
    document.getElementById("shortsRow").innerHTML = '<div class="empty">Searching...</div>';
    try { const results = await fetchYouTube(q); renderVideoGrid(results); renderShortsRow(results); }
    catch (e) { showError(e); }
  }
  window.search = search;
  window.loadSuggestions = loadSuggestions;
  window.addEventListener("load", () => setTimeout(loadSuggestions, 150));
})();
</script>

</script>

</body>
</html>
