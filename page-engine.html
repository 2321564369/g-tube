<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy-tube Page Engine</title>
</head>
<body>
  <!-- Shared embedded page engine. Pages are fetched from jsDelivr, never GitHub Pages. -->
  <script type="text/plain" id="galaxy-engine-source">
(function () {
  "use strict";

  var REPO_BASE = "https://raw.githubusercontent.com/2321564369/g-tube/main/";

  function loadPage(pageFile, params) {
    // A page running inside the generated frame delegates navigation to the
    // outer engine, which replaces the frame instead of creating nested frames.
    if (window.parent !== window) {
      try {
        var parentEngine = window.parent.GalaxyPageEngine;
        if (parentEngine && parentEngine !== window.GalaxyPageEngine) {
          return parentEngine.loadPage(pageFile, params);
        }
      } catch (e) {
        // If the embed host is cross-origin, continue with the local fallback.
      }
    }

    params = params || {};
    var safePage = String(pageFile || "").replace(/^\/+/, "");
    if (!safePage || safePage.indexOf("..") !== -1 ||
        !/^[a-zA-Z0-9._/-]+\.html$/.test(safePage)) {
      return Promise.reject(new Error("Invalid G-Tube page name."));
    }

    var target = new URL(safePage, REPO_BASE);
    Object.keys(params).forEach(function (key) {
      var value = params[key];
      if (value !== undefined && value !== null) {
        target.searchParams.set(key, String(value));
      }
    });

    return fetch(target.href, { cache: "no-cache" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.text();
      })
      .then(function (html) {
        var frame = document.createElement("iframe");
        frame.id = "galaxy-page-frame";
        frame.title = "Galaxy-tube";
        frame.style.cssText = "display:block;width:100%;height:100%;min-height:100vh;border:0;background:#000";
        frame.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
        frame.setAttribute("allowfullscreen", "");

        var oldFrame = document.getElementById("galaxy-page-frame");
        if (oldFrame) {
          oldFrame.replaceWith(frame);
        } else {
          document.documentElement.style.cssText = "margin:0;width:100%;height:100%;";
          document.body.style.cssText = "margin:0;width:100%;height:100%;";
          document.body.replaceChildren(frame);
        }

        var doc = frame.contentDocument;
        if (!doc) throw new Error("Could not access the embedded page frame.");

        var baseTag = '<base href="' + REPO_BASE + '">';
        var paramsJson = JSON.stringify(Object.fromEntries(target.searchParams.entries()))
          .replace(/</g, "\\u003c");
        var paramsScript = '<script>window.__GALAXY_PARAMS=' + paramsJson + ';<\/script>';

        if (/<head[^>]*>/i.test(html)) {
          html = html.replace(/<head([^>]*)>/i, function (match) {
            return match + baseTag + paramsScript;
          });
        } else {
          html = '<head>' + baseTag + paramsScript + '</head>' + html;
        }

        doc.open();
        doc.write(html);
        doc.close();
      });
  }

  window.GalaxyPageEngine = Object.freeze({ loadPage: loadPage });
})();
  </script>
  <p>Galaxy-tube shared embedded page engine.</p>
</body>
</html>
