<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy-tube Page Engine</title>
</head>
<body>
  <!-- Shared navigation engine for G-Tube. -->
  <script type="text/plain" id="galaxy-engine-source">
(function () {
  "use strict";

  // Use the published GitHub Pages site so each navigation creates a fresh
  // document and JavaScript realm. document.write() reused the old realm and
  // could cause top-level declarations to collide between pages.
  var SITE_BASE = "https://2321564369.github.io/g-tube/";

  function loadPage(pageFile, params) {
    params = params || {};
    var safePage = String(pageFile || "").replace(/^\/+/, "");
    if (!safePage || safePage.indexOf("..") !== -1 ||
        !/^[a-zA-Z0-9._/-]+\.html$/.test(safePage)) {
      return Promise.reject(new Error("Invalid G-Tube page name."));
    }

    var target = new URL(safePage, SITE_BASE);
    Object.keys(params).forEach(function (key) {
      var value = params[key];
      if (value !== undefined && value !== null) {
        target.searchParams.set(key, String(value));
      }
    });

    // Full same-tab navigation resets all page-level JavaScript declarations.
    window.location.href = target.href;
    return Promise.resolve();
  }

  window.GalaxyPageEngine = Object.freeze({ loadPage: loadPage });
})();
  </script>
  <p>Galaxy-tube shared navigation engine source. This file is loaded by index.html and watch.html.</p>
</body>
</html>
