<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy-tube</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #000; color: #fff; min-height: 100vh; }

.galaxy {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(95, 61, 196, 0.8), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(14, 165, 233, 0.6), transparent 35%),
    radial-gradient(circle at 50% 50%, #020617, #000);
  z-index: -2;
}
.galaxy::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 50px 80px, #fff, transparent),
    radial-gradient(1px 1px at 200px 150px, #fff, transparent),
    radial-gradient(1px 1px at 400px 300px, #fff, transparent),
    radial-gradient(1px 1px at 600px 100px, #fff, transparent),
    radial-gradient(1px 1px at 800px 400px, #fff, transparent),
    radial-gradient(1px 1px at 100px 500px, #fff, transparent);
  animation: stars 60s linear infinite;
  opacity: 0.5;
}
@keyframes stars { from { transform: translateY(0); } to { transform: translateY(-1000px); } }

.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 15px 20px; margin: 15px 20px 0;
  position: sticky; top: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px) saturate(1.2);
  border-radius: 16px;
  border: 1px solid rgba(167, 139, 250, 0.08);
  box-shadow: 0 4px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  z-index: 10;
}
.logo { font-size: 20px; font-weight: 700; color: #a78bfa; text-shadow: 0 0 10px rgba(167,139,250,0.5); white-space: nowrap; cursor: pointer; }
.back-link {
  color: rgba(255,255,255,0.7); font-size: 14px; padding: 6px 14px;
  border-radius: 20px; border: 1px solid rgba(167,139,250,0.2);
  background: rgba(255,255,255,0.05); cursor: pointer;
}
.back-link:hover { color: #fff; background: rgba(167,139,250,0.1); }
.current-user {
  margin-left: auto; font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer;
  padding: 6px 14px; background: rgba(255,255,255,0.05); border-radius: 20px;
  border: 1px solid rgba(167,139,250,0.2); white-space: nowrap;
}
.current-user:hover { color: #fff; background: rgba(167,139,250,0.1); }

.layout { display: flex; gap: 24px; padding: 20px; align-items: flex-start; }
.main-col { flex: 1; min-width: 0; max-width: 900px; }
.player-shell {
  width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden;
  border: 1px solid rgba(167,139,250,0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.player-shell video, .player-shell iframe { width: 100%; height: 100%; display: block; border: 0; }
.video-title { font-size: 22px; font-weight: 700; color: #fff; margin-top: 18px; text-shadow: 0 0 10px rgba(167,139,250,0.2); }
.video-info-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
  margin-top: 14px; padding: 14px 18px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(167,139,250,0.1); border-radius: 14px;
}
.channel-block { display: flex; align-items: center; gap: 12px; }
.channel-avatar {
  width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #5b21b6);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff;
  box-shadow: 0 4px 20px rgba(124,58,237,0.3);
}
.channel-name { font-weight: 600; font-size: 15px; color: #fff; }
.action-buttons { display: flex; gap: 10px; }
.action-btn {
  display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 20px;
  border: 1px solid rgba(167,139,250,0.25); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85);
  cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s ease;
}
.action-btn:hover { background: rgba(167,139,250,0.15); color: #fff; }
.action-btn.active { background: rgba(167,139,250,0.25); border-color: rgba(167,139,250,0.6); color: #a78bfa; }
.action-btn.dislike.active { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); color: #f87171; }

.side-col { width: 340px; flex-shrink: 0; }
.side-title { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.85); margin-bottom: 12px; }
.similar-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; border-radius: 10px; padding: 6px; transition: background 0.2s ease; }
.similar-item:hover { background: rgba(167,139,250,0.08); }
.similar-thumb {
  width: 140px; height: 78px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
  background: #2a1b69; position: relative; border: 1px solid rgba(167,139,250,0.15);
}
.similar-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.similar-duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px; }
.similar-meta { flex: 1; min-width: 0; }
.similar-meta .t { font-size: 13px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.similar-meta .c { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

.empty { text-align: center; padding: 30px; color: rgba(255,255,255,0.6); }

@media (max-width: 900px) { .layout { flex-direction: column; } .side-col { width: 100%; } }
</style>
</head>
<body>

<div class="galaxy"></div>

<div class="topbar">
  <div class="logo" id="logoLink">🌌 Galaxy-tube</div>
  <div class="back-link" id="backLink">← Home</div>
  <div class="current-user" id="accountPill" title="Click to set your YouTube API key">Set API key</div>
</div>

<div class="layout">
  <div class="main-col">
    <div class="player-shell" id="playerShell">
      <div class="empty">Loading...</div>
    </div>
    <div class="video-title" id="videoTitle"></div>
    <div class="video-info-bar">
      <div class="channel-block">
        <div class="channel-avatar" id="channelAvatar">?</div>
        <div class="channel-name" id="channelName"></div>
      </div>
      <div class="action-buttons">
        <button class="action-btn like" id="likeBtn" onclick="react('like')">👍 Like</button>
        <button class="action-btn dislike" id="dislikeBtn" onclick="react('dislike')">👎 Dislike</button>
        <button class="action-btn" id="watchLaterBtn" onclick="toggleWatchLater()">＋ Watch Later</button>
      </div>
    </div>
  </div>

  <div class="side-col">
    <div class="side-title">Similar videos</div>
    <div id="similarList">
      <div class="empty">Loading...</div>
    </div>
  </div>
</div>

<script>
(async function installGalaxyPageEngine() {
  try {
    const engineUrl = "https://raw.githubusercontent.com/2321564369/g-tube/main/page-engine.html";
    const response = await fetch(engineUrl, { cache: "no-cache" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const html = await response.text();
    const parsed = new DOMParser().parseFromString(html, "text/html");
    const source = parsed.getElementById("galaxy-engine-source");
    if (!source) throw new Error("Engine source was not found.");
    const script = document.createElement("script");
    script.textContent = source.textContent;
    document.head.appendChild(script);
  } catch (error) {
    console.error("[Galaxy Page Engine] Failed to initialize:", error);
  }
})();
</script>
<script>
(function(){
const API_BASE="https://www.googleapis.com/youtube/v3";
const API_KEY_STORAGE="galaxy_youtube_api_key";
const params=window.__GALAXY_PARAMS||Object.fromEntries(new URLSearchParams(location.search));
const videoId=String(params.youtube_id||params.id||"");
const fallbackTitle=String(params.title||"YouTube video");
function apiKey(){return localStorage.getItem(API_KEY_STORAGE)||"";}
function promptApiKey(){
 const key=prompt("Enter your YouTube Data API v3 key:",apiKey());
 if(key===null)return;
 if(key.trim())localStorage.setItem(API_KEY_STORAGE,key.trim());else localStorage.removeItem(API_KEY_STORAGE);
 loadVideo();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function ytApi(path,params){
 if(!apiKey())throw new Error("No API key set. Click Set API key in the top-right corner.");
 const url=new URL(API_BASE+"/"+path);
 Object.entries({...params,key:apiKey()}).forEach(([k,v])=>url.searchParams.set(k,v));
 const r=await fetch(url);const data=await r.json();
 if(!r.ok||data.error)throw new Error(data.error?.message||"YouTube API error "+r.status);
 return data;
}
async function gotoPage(file,extra={}){if(!window.GalaxyPageEngine)throw new Error("Page engine is still loading.");return window.GalaxyPageEngine.loadPage(file,extra);}
document.getElementById("logoLink").addEventListener("click",()=>gotoPage("index.html"));
document.getElementById("backLink").addEventListener("click",()=>gotoPage("index.html"));
document.getElementById("accountPill").onclick=promptApiKey;
const localKey="galaxy_local_video_data";
function localData(){try{return JSON.parse(localStorage.getItem(localKey)||"{}");}catch{return {};}}
function updateButtons(){
 const d=localData()[videoId]||{};
 document.getElementById("likeBtn").classList.toggle("active",d.reaction==="like");
 document.getElementById("dislikeBtn").classList.toggle("active",d.reaction==="dislike");
 document.getElementById("watchLaterBtn").classList.toggle("active",!!d.watchLater);
 document.getElementById("watchLaterBtn").textContent=d.watchLater?"✓ Saved":"＋ Watch Later";
}
function react(type){
 if(!videoId)return;
 const all=localData();all[videoId]=all[videoId]||{};
 all[videoId].reaction=all[videoId].reaction===type?null:type;
 localStorage.setItem(localKey,JSON.stringify(all));updateButtons();
}
function toggleWatchLater(){
 if(!videoId)return;
 const all=localData();all[videoId]=all[videoId]||{};all[videoId].watchLater=!all[videoId].watchLater;
 localStorage.setItem(localKey,JSON.stringify(all));updateButtons();
}
function renderPlayer(title,channel){
 document.getElementById("playerShell").innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(videoId)+'?autoplay=1&rel=0" title="'+esc(title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="width:100%;height:100%;border:0;display:block"></iframe>';
 document.getElementById("videoTitle").textContent=title;
 document.getElementById("channelAvatar").textContent=(channel||"?").trim().charAt(0).toUpperCase();
 document.getElementById("channelName").textContent=channel||"YouTube";
}
async function loadSimilar(query){
 const list=document.getElementById("similarList");
 if(!apiKey()){list.innerHTML='<div class="empty">Set an API key to load similar videos.</div>';return;}
 try{
  const s=await ytApi("search",{part:"snippet",type:"video",maxResults:8,q:query});
  const ids=(s.items||[]).map(x=>x.id?.videoId).filter(id=>id&&id!==videoId);
  if(!ids.length){list.innerHTML='<div class="empty">No similar videos found.</div>';return;}
  const d=await ytApi("videos",{part:"snippet",id:ids.join(",")});
  list.innerHTML=(d.items||[]).map(v=>{
   const title=v.snippet?.title||"YouTube video";
   const thumb=v.snippet?.thumbnails?.medium?.url||v.snippet?.thumbnails?.default?.url||"";
   return '<div class="similar-item" data-id="'+esc(v.id)+'" data-title="'+esc(title)+'"><div class="similar-thumb"><img src="'+esc(thumb)+'" alt=""></div><div class="similar-meta"><div class="t">'+esc(title)+'</div><div class="c">'+esc(v.snippet?.channelTitle||"Unknown channel")+'</div></div></div>';
  }).join("");
  list.querySelectorAll(".similar-item").forEach(el=>el.addEventListener("click",()=>gotoPage("watch.html",{youtube_id:el.dataset.id,title:el.dataset.title})));
 }catch(e){console.error("[YouTube API similar videos]",e);list.innerHTML='<div class="empty">Could not load similar videos: '+esc(e.message)+'</div>';}
}
async function loadVideo(){
 document.getElementById("accountPill").textContent=apiKey()?"API key set":"Set API key";
 if(!/^[a-zA-Z0-9_-]{11}$/.test(videoId)){
  document.getElementById("playerShell").innerHTML='<div class="empty">No valid YouTube video was specified.</div>';
  document.getElementById("videoTitle").textContent=fallbackTitle;
  document.getElementById("similarList").innerHTML='<div class="empty">No video selected.</div>';return;
 }
 let title=fallbackTitle,channel="YouTube";
 renderPlayer(title,channel);updateButtons();
 if(apiKey()){
  try{
   const d=await ytApi("videos",{part:"snippet",id:videoId});
   if(d.items?.[0]){
    title=d.items[0].snippet?.title||title;channel=d.items[0].snippet?.channelTitle||channel;
    document.getElementById("videoTitle").textContent=title;
    document.getElementById("channelAvatar").textContent=channel.charAt(0).toUpperCase();
    document.getElementById("channelName").textContent=channel;
   }
  }catch(e){console.error("[YouTube API video details]",e);}
  loadSimilar(title+" "+channel);
 }else{
  document.getElementById("similarList").innerHTML='<div class="empty">Set an API key to load similar videos and metadata.</div>';
 }
}
window.react = react;
window.toggleWatchLater = toggleWatchLater;
updateButtons();loadVideo();
})();
</script>

</body>
</html>
